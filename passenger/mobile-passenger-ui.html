<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AzTaxi Passenger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:Arial}
#map{height:100vh;width:100%}
.top{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:white;padding:10px 15px;border-radius:10px}
.call{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);padding:16px 28px;background:#ffd400;border:none;border-radius:30px;font-size:18px}
</style>
</head>
<body>

<div id="map"></div>
<div class="top">Hara gedirik?</div>
<button class="call">Maşın çağır</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([40.4093,49.8671],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
</script>

</body>
</html>
