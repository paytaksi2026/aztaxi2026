
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AzTaxi Passenger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
#map{height:100vh;}
button{position:absolute;top:10px;left:10px;z-index:1000;padding:10px;}
</style>
</head>
<body>
<button onclick="order()">Sifariş et</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io();

const map = L.map('map').setView([40.4093,49.8671],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'OSM'
}).addTo(map);

let marker;

map.on("click",(e)=>{
    if(marker) map.removeLayer(marker);
    marker = L.marker(e.latlng).addTo(map);
});

function order(){
    if(!marker) return alert("xəritədə nöqtə seç");
    socket.emit("create-order",marker.getLatLng());
}

</script>
</body>
</html>
