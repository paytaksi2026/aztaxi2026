<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Passenger</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>

<style>
#map {height:100vh;}
</style>

</head>
<body>

<div id="map"></div>

<script>

const socket = io();

var map = L.map('map').setView([40.4093,49.8671],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

let markers = {};

socket.on("drivers-update",(drivers)=>{

drivers.forEach(d=>{

if(!markers[d.id]){

markers[d.id] = L.marker([d.lat,d.lng]).addTo(map);

}else{

markers[d.id].setLatLng([d.lat,d.lng]);

}

});

});

</script>

</body>
</html>
