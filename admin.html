
<!DOCTYPE html>
<html>
<head>
<title>AzTaxi Admin</title>
</head>
<body>

<h2>AzTaxi Admin Panel</h2>

<button onclick="load()">Load Orders</button>

<div id="orders"></div>

<script>

async function load(){

const r = await fetch("/api/orders");
const data = await r.json();

document.getElementById("orders").innerHTML = JSON.stringify(data,null,2);

}

</script>

</body>
</html>
