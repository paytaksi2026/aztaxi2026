
<!DOCTYPE html>
<html>
<head>
<title>Rating</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">

<h2>Sürücünü qiymətləndir</h2>

<select id="stars">
<option>5</option>
<option>4</option>
<option>3</option>
<option>2</option>
<option>1</option>
</select>

<button onclick="rate()">Göndər</button>

</div>

<script>

async function rate(){

 await fetch("/api/rate",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   driverId:1,
   stars:Number(stars.value)
  })
 })

 alert("Reytinq göndərildi")

}

</script>

</body>
</html>
