
<!DOCTYPE html>
<html>
<head>
<title>AzTaxi Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card">
<h2>Müştəri qeydiyyat</h2>

<input id="c_phone" placeholder="Telefon">
<input id="c_password" type="password" placeholder="Parol">
<input id="c_name" placeholder="Ad">
<input id="c_surname" placeholder="Soyad">

<button onclick="registerCustomer()">Qeydiyyat</button>

<hr>

<h2>Sürücü qeydiyyat</h2>

<input id="d_phone" placeholder="Telefon">
<input id="d_password" type="password" placeholder="Parol">
<input id="d_name" placeholder="Ad">
<input id="d_surname" placeholder="Soyad">

<input id="car_brand" placeholder="Marka">
<input id="car_model" placeholder="Model">
<input id="car_number" placeholder="Nömrə">
<input id="car_color" placeholder="Rəng">

<button onclick="registerDriver()">Qeydiyyat</button>

</div>

<script src="js/register.js"></script>
</body>
</html>
