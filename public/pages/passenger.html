
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Passenger</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/css/style.css">

</head>
<body>

<div id="map"></div>

<div class="panel">

<input id="pickup" placeholder="Haradan">
<input id="drop" placeholder="Haraya">

<div class="cars">

<div class="car active" data-rate="0.6">Ekonom</div>
<div class="car" data-rate="0.8">Komfort</div>
<div class="car" data-rate="1.2">Premium</div>

</div>

<select id="payment">
<option>Cash</option>
<option>Card</option>
</select>

<div id="price"></div>

<button onclick="calculate()">Ride Request</button>

</div>

<div id="ratingBox" class="rating hidden">
<h3>Driver Rating</h3>
<button onclick="rate(5)">⭐⭐⭐⭐⭐</button>
<button onclick="rate(4)">⭐⭐⭐⭐</button>
<button onclick="rate(3)">⭐⭐⭐</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/passenger.js"></script>

</body>
</html>
