
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AzTaxi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/css/style.css">

</head>
<body>

<div id="map"></div>

<button id="locBtn">📍</button>

<div class="search-box">
<input id="pickup" placeholder="Haradan">
<input id="drop" placeholder="Haraya">
</div>

<div class="bottom-sheet">

<div class="cars">

<div class="car active" data-rate="0.6">
<div class="title">Ekonom</div>
<div class="sub">Ucuz gediş</div>
</div>

<div class="car" data-rate="0.8">
<div class="title">Komfort</div>
<div class="sub">Rahat maşın</div>
</div>

<div class="car" data-rate="1.2">
<div class="title">Premium</div>
<div class="sub">VIP xidmət</div>
</div>

</div>

<div id="price">Qiymət: -</div>

<button id="rideBtn">Ride Request</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
