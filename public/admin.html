
<!DOCTYPE html>
<html>
<head>
<title>AzTaxi Admin</title>
</head>
<body>

<h2>Orders</h2>

<button onclick="load()">Refresh</button>

<pre id="out"></pre>

<script>

async function load(){

 const r=await fetch("/api/orders");
 const d=await r.json();

 document.getElementById("out").textContent=JSON.stringify(d,null,2);

}

</script>

</body>
</html>
