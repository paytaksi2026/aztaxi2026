
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AzTaxi Passenger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
#map{height:90vh}
.panel{padding:10px}
</style>
</head>
<body>

<div class="panel">
<input id="from" placeholder="Haradan">
<input id="to" placeholder="Haraya">
<button onclick="order()">Sifariş</button>
<button onclick="myLoc()">📍 Mənim yerim</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>

let map = L.map('map').setView([40.4093,49.8671],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const socket = io();

function myLoc(){
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude
let lng=pos.coords.longitude
map.setView([lat,lng],15)
L.marker([lat,lng]).addTo(map)
})
}

async function order(){

let r = await fetch("/api/order",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
passenger_id:1,
pickup_lat:40.4093,
pickup_lng:49.8671,
drop_lat:40.38,
drop_lng:49.89
})
})

alert("Sifariş göndərildi")

}

socket.on("driverMove", d=>{

L.marker([d.lat,d.lng]).addTo(map)

})

</script>

</body>
</html>
