
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AzTaxi</title>

<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>
<body>

<div id="map"></div>

<div class="topBar">
  <div class="logo">🚕 AzTaxi</div>
</div>

<div class="bottomPanel">

  <div class="inputBlock">
    <input id="from" placeholder="Haradan gedəcəksiniz?">
    <div id="fromList" class="list"></div>
  </div>

  <div class="inputBlock">
    <input id="to" placeholder="Haraya gedəcəksiniz?">
    <div id="toList" class="list"></div>
  </div>

  <div id="rideOptions" class="rides"></div>

  <button class="orderBtn">Sifariş et</button>

</div>

<script src="app.js"></script>

</body>
</html>
