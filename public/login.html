
<!DOCTYPE html>
<html>
<head>
<title>AzTaxi Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">

<h2>Daxil ol</h2>

<input id="phone" placeholder="Telefon">
<input id="password" placeholder="Şifrə">

<button onclick="login()">Daxil ol</button>

</div>

<script>

async function login(){

 const r=await fetch("/api/login",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   phone:phone.value,
   password:password.value
  })
 })

 const user=await r.json()

 localStorage.userId=user.id

 if(user.role==="driver"){
  location="driver_profile.html"
 }else{
  location="passenger.html"
 }

}

</script>

</body>
</html>
