<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AzTaxi Driver</title>
</head>
<body>
<h2>Driver Panel</h2>
<button onclick="online()">Go Online</button>

<div id="rides"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

function online(){
    socket.emit("driver-online",{name:"Driver"});
}

socket.on("new-ride",(data)=>{
    const div=document.getElementById("rides");
    const btn=document.createElement("button");
    btn.innerText="Accept Ride "+data.rideId;
    btn.onclick=()=>{
        socket.emit("accept-ride",{rideId:data.rideId});
    };
    div.appendChild(btn);
});
</script>
</body>
</html>
