
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AzTaxi Driver</title>
</head>
<body>

<h2>Driver Panel</h2>
<button onclick="start()">Online ol</button>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

function start(){

navigator.geolocation.watchPosition(pos=>{

socket.emit("driverLocation",{
driver_id:2,
lat:pos.coords.latitude,
lng:pos.coords.longitude
})

})

}

</script>

</body>
</html>
