
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Admin</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div class="header">AzTaxi Admin</div>

<div class="card">
Drivers online: <span id="drivers"></span>
</div>

<div class="card">
Orders: <span id="orders"></span>
</div>

<script>
async function load(){
const d=await fetch("/api/drivers").then(r=>r.json());
const o=await fetch("/api/orders").then(r=>r.json());
document.getElementById("drivers").innerText=Object.keys(d).length;
document.getElementById("orders").innerText=o.length;
}
setInterval(load,2000);
</script>

</body>
</html>
