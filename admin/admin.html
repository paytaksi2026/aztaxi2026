
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AzTaxi Admin</title>
</head>
<body>
<h2>Orders</h2>
<ul id="orders"></ul>

<script>
fetch("/api/orders")
.then(r=>r.json())
.then(data=>{
    const ul = document.getElementById("orders");
    data.forEach(o=>{
        const li = document.createElement("li");
        li.innerText = JSON.stringify(o);
        ul.appendChild(li);
    });
});
</script>
</body>
</html>
