
<!DOCTYPE html>
<html>
<head>
<title>AzTaxi Driver</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
body{margin:0;font-family:Arial}
#map{height:90vh}
</style>
</head>
<body>

<div id="map"></div>

<script>

const socket=io();

const map=L.map("map").setView([40.4093,49.8671],13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

navigator.geolocation.watchPosition(p=>{

 const loc={location:{lat:p.coords.latitude,lng:p.coords.longitude}};

 socket.emit("driver-location",loc);

});

socket.emit("driver-online",{online:true});

socket.on("order",o=>{

 if(confirm("New trip request")){
  socket.emit("accept",o);
 }

});

</script>

</body>
</html>
