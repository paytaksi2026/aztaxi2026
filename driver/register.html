
<h3>Driver Register</h3>
<input id=name placeholder=name><br>
<input id=email placeholder=email><br>
<input id=pass placeholder=password><br>
<input id=car placeholder=car><br>
<button onclick="reg()">Register</button>

<script>
function reg(){
fetch("/api/driver/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:name.value,
email:email.value,
password:pass.value,
car:car.value
})
}).then(()=>alert("driver registered"))
}
</script>
