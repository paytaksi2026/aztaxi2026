<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Driver</title>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<h2>Driver Online</h2>

<script>
const socket = io();

navigator.geolocation.watchPosition((pos)=>{

socket.emit("driver-location",{
id:"driver1",
lat:pos.coords.latitude,
lng:pos.coords.longitude
});

});
</script>

</body>
</html>
