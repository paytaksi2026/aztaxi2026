<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AzTaxi Driver</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:Arial}
#map{height:100vh;width:100%}
.panel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:white;padding:15px;border-radius:12px}
.btn{padding:12px 20px;border:none;border-radius:20px;background:#ffd400}
</style>
</head>
<body>

<div id="map"></div>

<div class="panel">
<button class="btn">Online</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([40.4093,49.8671],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
</script>

</body>
</html>
