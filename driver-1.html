
<!DOCTYPE html>
<html>
<head>
<title>AzTaxi Driver</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<h2>AzTaxi Driver Panel</h2>

<button onclick="online()">Go Online</button>

<div id="orders"></div>

<script>
const socket = io();

function online(){
socket.emit("driver-online",{driver:"online"});
}

socket.on("new-order",order=>{
const div=document.createElement("div");
div.innerHTML=`
Pickup: ${order.pickup} → ${order.destination}
<button onclick='accept(${JSON.stringify(order)})'>Accept</button>
`;
document.getElementById("orders").appendChild(div);
});

function accept(o){
socket.emit("accept-order",o);
}

</script>

</body>
</html>
